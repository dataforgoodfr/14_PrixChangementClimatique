repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: "v0.2.1"
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.4
    hooks:
      - id: sqlfluff-lint
        exclude: ^data/dbt_pipeline/seeds/|^data/dbt_pipeline/csv_inputs/
      - id: sqlfluff-fix
        exclude: ^data/dbt_pipeline/seeds/|^data/dbt_pipeline/csv_inputs/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        args: ["--parser", "yaml", "--write"]
        files: \.ya?ml$
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v1.0.0
    hooks:
      - id: check-model-has-all-columns
        stages: [manual]
        args:
          [
            "--manifest",
            "data/dbt_pipeline/target/manifest.json",
            "--catalog",
            "data/dbt_pipeline/target/catalog.json",
          ]
      - id: check-model-has-description
        stages: [manual]
        args: ["--manifest", "data/dbt_pipeline/target/manifest.json"]
      - id: check-model-columns-have-desc
        stages: [manual]
        args: ["--manifest", "data/dbt_pipeline/target/manifest.json"]
