name: "dbt_pipeline"
version: "1.0.0"

profile: "pcc_dbt_pipeline"

# specifiy dbt directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_pipeline:
    bronze:
      +schema: bronze
      +materialized: table
      +persist_docs:
        relation: true
        columns: true
    silver:
      +schema: silver
      +materialized: view
      +persist_docs:
        relation: true
        columns: true
    gold:
      +schema: gold
      +materialized: view
      +persist_docs:
        relation: true
        columns: true
    serving:
      +schema: serving
      +materialized: table
      +persist_docs:
        relation: true
        columns: true

# Loading duckdb extension for geo data
on-run-start:
  - "INSTALL spatial;"
  - "LOAD spatial;"

