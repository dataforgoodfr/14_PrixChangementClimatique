version: 2

models:
  - name: resultats_nationaux
    description: >
      Serving layer: Table des résultats nationaux.
      Source: Gold layer avec indicateurs et scores calculés
    columns:
      - name: score_economique_mediane
        description: "score economique national médian"
        type: DECIMAL(3,2)
      - name: score_exposition_mediane
        description: "score exposition national médian"
        type: DECIMAL(3,2)
      - name: score_assurance_mediane
        description: "score assurance national médian"
        type: DECIMAL(3,2)
      - name: indice_vulnerabilite_niveau_mediane
        description: "niveau d'indice de vulnérabilité médian"
        type: INT
      - name: part_communes_vulnerables
        description: "à partir de quel score une commune est vulnérable"
        type: DECIMAL(3,2)
      - name: multiple_franchise_mediane
        description: "Médiane nationale du multiplicateur franchise"
        type: DECIMAL(10,2)
      - name: part_arretes_non_reconnus_mediane
        description: "Médiane nationale de la part des arrêtés non reconnus"
        type: DECIMAL(10,2)
      - name: primes_assurances_2024_somme
        description: "Total national des primes d'assurances en 2024"
        type: DECIMAL(15,2)
      - name: primes_assurances_2020_somme
        description: "Total national des primes d'assurances en 2020"
        type: DECIMAL(15,2)
      - name: impots_locaux_2024_somme
        description: "Total national des impots locaux en 2024"
        type: DECIMAL(15,2)
      - name: impots_locaux_2020_somme
        description: "Total national des impots locaux en 2020"
        type: DECIMAL(15,2)
      - name: taux_evolution_prime_assurance_mediane
        description: "Taux d'évolution des primes entre 2020 et 2024 (%)"
        type: DECIMAL(10,0)
      - name: part_prime_budget_2024_mediane
        description: "Somme des primes d'assurances et budget de 2024"
        type: DECIMAL(10,3)
      - name: depenses_per_pop_mediane
        description: "Solde net des dépenses par population sur 2023 (manque la population municipale de 2024)"
        type: DECIMAL(10,2)
      - name: taux_endettement_mediane
        description: "dettes 2024 par rapport aux dépenses de 2024"
        type: DECIMAL(10,2)
