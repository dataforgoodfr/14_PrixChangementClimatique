version: 1

models:
  - name: score_climatique
    description: >
      Gold layer: Score climatique par commune, constuit sur les indicateurs catnat, pprn, exposition aux tri et rga, et scenario pluie 2050
       Scores intermédiaires sécheresse + inondation
      Sources :
      - Gold layer : pprn, ccr_total,
      - Silver layer : scenario_2050, indicateurs_tri_rga_bats_par_com
    columns:
      - name: code_geo
        description: "Code INSEE de la commune (5 caractères)"
        type: STRING
      - name: score_secheresse_norm
        description: "Score sécheresse de la commune"
        type: FLOAT
      - name: score_inondation_norm
        description: "Score inondation de la commune"
        type: FLOAT
      - name: score_secheresse_net
        description: "Score sécheresse de la commune avant normalisation"
        type: FLOAT
      - name: score_inondation_net
        description: "Score inondation de la commune avant normalisation"
        type: FLOAT
      - name: score_climatique
        description: "Score climatique"
        type: FLOAT
