      Gold layer: Score d'exposition aux risques climatiques par commune, constuit sur les indicateurs catnat, pprn, exposition aux tri et rga, et scenario pluie 2050
       Scores intermédiaires sécheresse + inondation
      Sources :
      - Gold layer : pprn, ccr_total,
      - Silver layer : scenario_2050, indicateurs_tri_rga_bats_par_com
