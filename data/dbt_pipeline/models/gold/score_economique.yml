version: 1

models:
  - name: score_economique
    description: >
      Gold layer: Score économique par commune construit sur dettes et dépenses par habitant
      Source: Gold layer : budget_last
    columns:
      - name: code_geo
        description: "Code INSEE de la commune (5 caractères)"
        type: STRING
      - name: ratio_dettes_norm
        description: dettes/depenses de la derniere année 2024 (valeur normalisée)
        data_type: DOUBLE
      - name: depenses_per_pop_norm
        description: Solde net pour le type de compte "depenses" par population municipale de 2023 (valeur normalisée)
        data_type: DOUBLE
      - name: score_economique
        description: "Score économique commune"
        type: FLOAT
