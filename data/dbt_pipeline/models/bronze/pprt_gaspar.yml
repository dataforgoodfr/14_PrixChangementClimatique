version: 2

models:
  - name: pprt_gaspar
    description: |-
      8.1. Définition -
      Le plan de prévention des risques technologiques est un document réalisé par l’État qui
      réglemente l'utilisation des sols en fonction des risques technologiques auxquels ils sont soumis.
      Cette réglementation va de l'interdiction de construire à la possibilité de construire sous certaines conditions.
      http://www.georisques.gouv.fr/articles/les-plans-de-prevention-des-risques-naturels-pprn

      2. Structure -
      Chaque procédure est décrite par une ligne par commune et par risque traité.
      La table comprend les procédures en vigueur, les procédures en cours, les procédures annulées, abrogées et déprescrites, ainsi que les procédures révisées par une autre procédure.

      3. Dictionnaire de données (erreur) - https://www.georisques.gouv.fr/sites/default/files/Georisques_DictionnaireDonneesGaspar_1.0.pdf
