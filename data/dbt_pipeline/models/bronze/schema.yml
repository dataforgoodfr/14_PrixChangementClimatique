  - name: recensement_hors_com
    description: >
      Séries historiques en 2022 - Données hors collectivités d'outre-mer - Recensement de la population - Base des principaux indicateurs - Les deux bases fournissent des résultats sur les naissances, les décès, la population, les résidences principales, les résidences secondaires et logements occasionnels, les caractéristiques des personnes des ménages. Les données sont diffusées selon la géographie en vigueur au 1er janvier 2025. Niveau géographique : commune, arrondissement municipal. Résultats : les indicateurs sont disponibles pour 1968, 1975, 1982, 1990, 1999, 2006, 2011, 2016 et 2022. https://www.insee.fr/fr/statistiques/8582555
    columns:
      - name: code_geo
        description: "Code du département suivi du numéro de commune ou du numéro d'arrondissement municipal"
        type: VARCHAR
      - name: p_22_pop
        description: Population en 2022
        type: INT
      - name: p_16_pop
        description: Population en 2016
        type: INT
      - name: p_11_pop
        description: Population en 2011
        type: INT
      - name: p_06_pop
        description: Population en 2006
        type: INT
      - name: d_99_pop
        description: Population en 1999
        type: INT
      - name: d_90_pop
        description: Population sans les doubles comptes en 1990
        type: INT
      - name: d_82_pop
        description: Population sans les doubles comptes en 1982
        type: INT
      - name: d_75_pop
        description: Population sans les doubles comptes en 1975 (en 1974 pour les DOM)
        type: INT
      - name: d_68_pop
        description: Population sans les doubles comptes en 1968 (en 1967 pour les DOM)
        type: INT
      - name: superf
        description: Superficie (en km²)
        type: FLOAT
      - name: nais_1621
        description: Nombre de naissances entre le 01/01/2016 et le 31/12/2021
        type: INT
      - name: nais_1115
        description: Nombre de naissances entre le 01/01/2011 et le 31/12/2015
