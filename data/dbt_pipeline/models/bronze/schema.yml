      8.1. Définition -
      Le plan de prévention des risques technologiques est un document réalisé par l’État qui
      réglemente l'utilisation des sols en fonction des risques technologiques auxquels ils sont soumis.
      Cette réglementation va de l'interdiction de construire à la possibilité de construire sous certaines conditions.
