version: 2

models:
  - name: ccr_details
    description: |-
      Liste des arrêtés de catastrophe naturelle par commune
      affichés sur https://www.ccr.fr/portail-catastrophes-naturelles/liste-arretes/
      et récupérés depuis l'API de la CCR -
      https://www.ccr.fr/wp-admin/admin-ajax.php
      /!\ Les données brutes contiennent 516 doublons, ceci est une erreur du site CCR /!\
    columns:
      - name: code_geo
        description: Code commune sous le format code géographique à 5 chiffres (ex 75056 pour Paris)
        type: VARCHAR
      - name: date_arrete
        description: Date de l'arrêté de catastrophe naturelle
        type: DATE
      - name: date_debut_evenement
        description: Date de début de l'événement de catastrophe naturelle
        type: DATE
      - name: date_fin_evenement
        description: Date de fin de l'événement de catastrophe naturelle
        type: DATE
      - name: nom_commune
        description: Nom de la commune concernée par l'arrêté de catastrophe naturelle
        type: VARCHAR
      - name: nom_peril
        description: Nom du risque concerné par l'arrêté de catastrophe naturelle
        type: VARCHAR
      - name: date_parution_jo
        description: Date de publication de l'arrêté de catastrophe naturelle au journal officiel
        type: DATE
      - name: franchise
        description: Type de franchise applicable à la commune
        type: VARCHAR
      - name: libelle_avis
        description: Décision de reconnaissance de l'état de catastrophe naturelle
        type: VARCHAR
      - name: code_arrete
        description: Identifiant de l'arrêté de la CCR relatif à la déclaration de catastrophe naturelle
        type: INT
