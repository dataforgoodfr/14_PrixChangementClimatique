models:
  - name: indicateurs_budget
    description: >
      Indicateur budget par année et par communes, depuis 2010
      (Attention : les données de population sont disponibles à partir de 2016)
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_geo_from_siren
            - annee

    columns:
      - name: code_geo_from_siren
        description: code geo venant du merge sur le siren avec le fichier https://www.data.gouv.fr/datasets/table-de-correspondance-entre-ndeg-siren-et-code-insee-des-communes
        data_type: varchar
      - name: nom_com
        description: Nom de la commune venant du merge sur le siren avec le fichier https://www.data.gouv.fr/datasets/table-de-correspondance-entre-ndeg-siren-et-code-insee-des-communes
        data_type: varchar
      - name: annee
        description: Année de l'exercice
        data_type: bigint
        data_tests:
          - not_null
      - name: dettes
        description: Solde net pour le type de compte "dettes financières"
        data_type: double
      - name: primes
        description: Solde net pour le type de compte "primes d’assurances"
        data_type: double
      - name: depenses
        description: Solde net pour le type de compte "depenses"
        data_type: double
      - name: produits
        description: Solde net pour le type de compte "produits"
        data_type: double
      - name: solde_annuel
        description: produits - depenses
        data_type: double
      - name: ratio_dettes_produits
        description: dettes/produits
        data_type: double
      - name: ratio_dettes_depenses
        description: dettes/depenses
        data_type: double
      - name: ratio_primes_depenses
        description: primes/depenses
        data_type: double
      - name: population
        description: Population municipale
        data_type: integer
      - name: dettes_per_pop
        description: Solde net pour le type de compte "dettes financières" par population municipale
        data_type: double
      - name: primes_per_pop
        description: Solde net pour le type de compte "primes d’assurances" par population municipale
        data_type: double
      - name: depenses_per_pop
        description: Solde net pour le type de compte "depenses" par population municipale
        data_type: double
      - name: produits_per_pop
        description: Solde net pour le type de compte "produits" par population municipale
        data_type: double
      - name: solde_annuel_per_pop
        description: (produits - depenses)  par population municipale
        data_type: double
