models:
  - name: batiments_risk
    description: >
      Table communale agrégeant les scores de risques naturels. 
      Elle combine l'exposition au Retrait-Gonflement des Argiles (RGA) pondérée par l'ancienneté du bâti 
      et les indicateurs des Territoires à Risque Important d'inondation (TRI).

    columns:
      - name: code_geo
        description: "Code INSEE de la commune"
        data_type: string
        data_test:
          - unique
          - not_null

      - name: rga_score
        description: >
          Indicateur de vulnérabilité au RGA. 
          Calculé par une somme pondérée du nombre de maisons par risque et période de construction, 
          divisée par le nombre total de maisons.
          Poids périodes : 1976-2020 (1.0), 1945-1975 & post-2020 (0.5), pré-1945 (0.0).
          Poids sévérité : faible (1.0), moyen (5.0), fort (10.0).
        data_type: float

      - name: tri_score
        description: >
          Score d'exposition aux inondations (TRI). 
          Somme pondérée des indicateurs de risque : faible (coefficient 1), moyen (coefficient 3) 
          et fort (coefficient 5).
        data_type: float