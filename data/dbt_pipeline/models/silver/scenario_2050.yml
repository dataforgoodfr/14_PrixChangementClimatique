version: 2

models:
  - name: scenario_2050
    description: |-
      Provient de DRIAS, attribue à une commune le point le plus proche de la latitude et longitude du centre de la commune-
    columns:
      - name: code_geo
        description: Code de la commune concernée
        data_type: varchar
        quote: true
      - name: nortx_35_d_yr
        description: "Nombre de jours avec Tx >= 35°C (jour(s))"
        type: FLOAT
      - name: norrrq_99_ref_d_yr
        type: FLOAT
        description: "Ecart de fréquence des précipitations quotidienne remarquables (jour(s))"
      - name: norswi_04_yr
        description: "Nombre de jours avec SWI < 0.4 (jour(s))"
        type: INTEGER
      - name: nortr_yr
        description: "Nombre de nuits tropicales (jour(s))"
        type: FLOAT
      - name: norrr_yr
        description: "Cumul de précipitations annuelles (mm)"
        type: FLOAT
