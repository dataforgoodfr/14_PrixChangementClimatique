version: 2

models:
  - name: primes_par_communes
    description: >
      Table des primes d'assurances agrégées par année et parcommunes.
    columns:
      - name: annee
        description: "Année de l'exercice"
        data_type: integer
      - name: code_geo
        description: "Code commune - appelé code_geo dans les données bronze du projet"
        type: STRING
      - name: prime_assurance
        description: somme des primes d'assurances pour les comptes 616, 6161, 6162 et 6168
        data_type: float
