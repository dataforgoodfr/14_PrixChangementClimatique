name: build-and-deploy-website

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image to GHCR, deploy to Clever Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv and tippecanoe
        run: pip install uv tippecanoe

      - name: Install Python dependencies
        run: uv sync

      - name: Install DuckDB spatial extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"

      - name: Download DuckDB from S3
        run: uv run python data/utils/download.py

      - name: Generate PMTiles
        run: uv run python data/utils/build_pmtiles.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Clever Cloud
        uses: 47ng/actions-clever-cloud@v2.1.0
        with:
          appID: ${{ secrets.CLEVER_APP_ID }}
          sameCommitPolicy: rebuild
          setEnv: |
            CC_DOCKERFILE=Dockerfile.clevercloud
            IMAGE_TAG=latest
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
