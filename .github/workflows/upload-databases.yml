name: upload-databases

on:
  push:
    branches:
      - main
    paths:
      - "data/dbt_pipeline/models/**"
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Update DuckDB from S3-hosted csv files and notify to DA
    runs-on: ubuntu-latest

    env:
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      S3_PCC_BUCKET: ${{ vars.S3_PCC_BUCKET }}
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync

      - name: Set all files on S3 to public read
        run: |
          uv run python data/utils/set_all_files_to_public_read.py

      - name: Download pipeline csv inputs from bucket
        run: |
          uv run python data/utils/download_pipeline_inputs.py

      - name: Install dbt dependencies
        run: |
          cd data/dbt_pipeline
          uv run dbt deps

      - name: Run dbt (create dev.duckdb)
        run: |
          cd data/dbt_pipeline
          uv run dbt run

      - name: Create website.duckdb
        run: |
          uv run python data/utils/trim_website_db.py

      - name: Upload dev and website databases to bucket root
        run: |
          uv run python data/utils/duckdb_uploader.py
          uv run python data/utils/duckdb_uploader.py --website

      - name: Notify new dbt models
        run: |
          uv run python data/utils/notify_new_dbt_models.py
